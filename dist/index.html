<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO OUEST 🎾</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>" />
  <script type="module" crossorigin src="/assets/index-AkcbsKrS.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CYBUWKq2.css">
</head>
<body>
  <header>
    <canvas id="header-art" aria-hidden="true"></canvas>
    <div class="admin-corner">
      <button id="admin-access-trigger" class="admin-access-btn" type="button" aria-label="Connexion admin">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </button>
      <span class="sync-badge sync-badge--header" id="sync-badge" hidden></span>
    </div>
    <img src="/logo.png" alt="GO OUEST 2026" class="header-logo" />
  </header>

  <nav>
    <button class="tab-btn active" data-tab="poules">🏸 Poules</button>
    <button class="tab-btn" data-tab="planning">📅 Planning</button>
    <button class="tab-btn" data-tab="finale">🏆 Finale</button>
  </nav>

  <main>
    <section id="poules" class="tab-content active"></section>
    <section id="planning" class="tab-content"></section>
    <section id="finale" class="tab-content"></section>
  </main>

  <div id="backup-status" class="backup-status backup-status--toast" aria-live="polite"></div>

  <footer class="site-footer">
    <a class="footer-link" href="https://photos.app.goo.gl/KSqFmGaNLu6rSTBt9" target="_blank" rel="noopener" data-confirm-label="Google Photos" data-confirm-desc="Ouvrir l'album photo du tournoi dans Google Photos ?">
      <span class="footer-link__icon">📸</span>
      <span class="footer-link__label">Photos</span>
    </a>
    <a class="footer-link" href="https://maps.app.goo.gl/SQ7N5E5UD1HRFVS49" target="_blank" rel="noopener" data-confirm-label="Courts de tennis" data-confirm-desc="Ouvrir l'itinéraire vers les courts de tennis dans Google Maps ?">
      <span class="footer-link__icon">🎾</span>
      <span class="footer-link__label">Tennis</span>
    </a>
    <a class="footer-link" href="https://maps.app.goo.gl/PRGmBdE3VnSwFzmt5" target="_blank" rel="noopener" data-confirm-label="AT — Anne-Thaïs" data-confirm-desc="Ouvrir l'itinéraire vers l'AT (17 rue de la Touche, Noirmoutier) dans Google Maps ?">
      <span class="footer-link__icon">🏠</span>
      <span class="footer-link__label">AT</span>
    </a>
    <aside id="admin-toolbar" class="footer-admin" hidden>
      <button id="backup-mock" class="footer-link footer-admin-btn" type="button">
        <span class="footer-link__icon">🎲</span>
        <span class="footer-link__label">Mock</span>
      </button>
      <button id="backup-reset" class="footer-link footer-admin-btn footer-admin-btn--danger" type="button">
        <span class="footer-link__icon">🗑️</span>
        <span class="footer-link__label">Reset</span>
      </button>
    </aside>
  </footer>

  <div id="admin-modal" class="admin-modal" hidden>
    <button class="admin-modal__backdrop" type="button" data-admin-close aria-label="Fermer"></button>
    <div class="admin-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
      <button class="admin-modal__close" type="button" data-admin-close aria-label="Fermer">×</button>
      <div class="admin-modal__eyebrow">Organisateurs</div>
      <h2 id="admin-modal-title" class="admin-modal__title">Connexion admin</h2>
      <p id="admin-modal-copy" class="admin-modal__copy"></p>

      <form id="admin-login-form" class="admin-form">
        <label class="admin-form__label" for="admin-password">Mot de passe</label>
        <input id="admin-password" class="admin-form__input" type="password" autocomplete="current-password" required />
        <div id="admin-error" class="admin-form__error" aria-live="polite"></div>
        <button id="admin-login-submit" class="backup-btn backup-btn--primary admin-form__submit" type="submit">Activer le mode admin</button>
      </form>

      <div id="admin-logged-panel" class="admin-logged-panel" hidden>
        <div class="admin-logged-panel__text">Tu peux maintenant saisir les scores et utiliser les outils organisateurs sur cet appareil.</div>
        <button id="admin-logout" class="backup-btn" type="button">Se deconnecter</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="admin-modal" hidden>
    <button class="admin-modal__backdrop" type="button" data-confirm-close aria-label="Annuler"></button>
    <div class="admin-modal__dialog confirm-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
      <div class="admin-modal__eyebrow">Action admin</div>
      <h2 id="confirm-modal-title" class="admin-modal__title">Confirmer l'action</h2>
      <p id="confirm-modal-copy" class="admin-modal__copy"></p>
      <div class="confirm-modal__actions">
        <button id="confirm-modal-cancel" class="backup-btn" type="button" data-confirm-close>Annuler</button>
        <button id="confirm-modal-submit" class="backup-btn backup-btn--primary" type="button">Confirmer</button>
      </div>
    </div>
  </div>

</body>
</html>
