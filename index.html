<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GO OUEST 🎾</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <header>
    <h1>🎾 GO OUEST 2026</h1>
    <p class="sub">Tournoi Mixte · 2 terrains · 6 heures</p>
    <div class="stats-row">
      <div><div class="stat-num" id="stat-duos">—</div><div class="stat-lbl">Duos</div></div>
      <div><div class="stat-num" id="stat-pools">—</div><div class="stat-lbl">Poules</div></div>
      <div><div class="stat-num" id="stat-matches">—</div><div class="stat-lbl">Matchs</div></div>
      <div><div class="stat-num">6h</div><div class="stat-lbl">Durée cible</div></div>
    </div>
  </header>

  <nav>
    <button class="tab-btn active" data-tab="poules">🏸 Poules</button>
    <button class="tab-btn" data-tab="planning">📅 Planning</button>
    <button class="tab-btn" data-tab="finale">🏆 Finale</button>
  </nav>

  <main>
    <section id="poules" class="tab-content active"></section>
    <section id="planning" class="tab-content"></section>
    <section id="finale" class="tab-content"></section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
